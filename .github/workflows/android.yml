# CI/CD Net Scan
# - build-and-test : tests unitaires (JVM), lint et APK debug, à chaque push et pull request.
# - instrumented   : tests Android (Compose, Room, parcours) sur émulateur API 36 (= minSdk).
# - release        : sur un tag v*, publie l'APK debug du prototype dans une release GitHub.
name: Android CI

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # JVM exigée par gradle/gradle-daemon-jvm.properties : évite un téléchargement à chaque exécution.
  JAVA_VERSION: "25"
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build-and-test:
    name: Tests unitaires, lint et APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      # gradlew est versionné depuis Windows sans le bit exécutable.
      - run: chmod +x gradlew

      - name: Tests unitaires
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        # Non bloquant tant que les avertissements existants n'ont pas été traités : le rapport est publié.
        continue-on-error: true
        run: ./gradlew :app:lintDebug

      - name: APK debug
        run: ./gradlew :app:assembleDebug

      - name: Rapports de tests et de lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-unitaires-lint
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: APK debug (prototype)
        uses: actions/upload-artifact@v4
        with:
          name: net-scan-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  instrumented:
    name: Tests instrumentés (émulateur API 36)
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_LEVEL: 36
      TARGET: google_apis
      ARCH: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Activer KVM (accélération de l'émulateur)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compiler l'app et les tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Cache de l'AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.TARGET }}-${{ env.ARCH }}

      - name: Créer l'AVD et son snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Snapshot de l'AVD créé."

      - name: Tests instrumentés
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Rapports des tests instrumentés
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-instrumentes
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  release:
    name: Release GitHub (tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, instrumented]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: net-scan-debug-apk
          path: apk

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          prerelease: true
          body: |
            APK **debug** du prototype Net Scan, non signé pour le Play Store.
            Installation manuelle uniquement (sources inconnues), pour test.
